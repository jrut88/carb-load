<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carb Load</title>
<meta name="description" content="Build a race-week carb-loading plan, meal by meal, with a shopping list.">
<meta name="theme-color" content="#EDEDEB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E0E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Carb Load">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="top">
    <div class="top-row">
      <h1 id="page-title">Your load</h1>
      <div class="top-actions" id="top-actions"></div>
    </div>
    <p class="mono" id="race-line"></p>
  </header>

  <main>
    <section class="tab-panel" id="tab-plan" hidden></section>
    <section class="tab-panel" id="tab-training" hidden></section>
    <section class="tab-panel" id="tab-foods" hidden></section>
    <section class="tab-panel" id="tab-shop" hidden></section>
    <section class="tab-panel" id="tab-setup" hidden></section>
  </main>

  <footer class="app-footer">
    <p>General guidance, not medical advice. If you have diabetes, a GI condition or a history of disordered eating, check with a doctor or sports dietitian first. Try your load before a long training run before race week.</p>
  </footer>

</div>

<nav class="tab-bar" aria-label="Sections">
  <button type="button" class="tab-btn" data-tab="training"><i class="ph ph-sneaker-move" aria-hidden="true"></i><span>Training</span></button>
  <button type="button" class="tab-btn" data-tab="foods"><i class="ph ph-bowl-food" aria-hidden="true"></i><span>Foods</span></button>
  <button type="button" class="tab-btn tab-main" data-tab="plan"><span class="tab-fab"><i class="ph-bold ph-fork-knife" aria-hidden="true"></i></span><span>Plan</span></button>
  <button type="button" class="tab-btn" data-tab="shop"><i class="ph ph-basket" aria-hidden="true"></i><span>Shop</span></button>
  <button type="button" class="tab-btn" data-tab="setup"><i class="ph ph-sliders-horizontal" aria-hidden="true"></i><span>Setup</span></button>
</nav>

<dialog id="meal-sheet" class="sheet" aria-label="Edit meal"></dialog>

<script src="foods.js"></script>
<script src="app.js"></script>
</body>
</html>
